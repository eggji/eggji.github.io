<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="One Paper a Day — Jinlong Ji" />
  <title>One Paper a Day — Jinlong Ji</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <main>
    <p class="nav-back"><a href="../">← Jinlong Ji</a> · <a href="../blog/">Blog</a></p>
    <header>
      <h1>One Paper a Day</h1>
      <p class="contact">Short notes on papers I read. Newest first; click a tag to filter.</p>
    </header>

    <p class="tag-filter" id="tag-filter" hidden>
      Tagged <strong id="tag-filter-name"></strong> · <a href="./" id="tag-filter-clear">show all</a>
    </p>

    <!-- Add new entries at the top. Tags in data-tags are separated by "|". -->
    <ul class="blog-list paper-list" id="paper-list">
      <li data-tags="RL|LLM reasoning|Post-training|Evaluation|Empirical study">
        <time datetime="2026-09-28">2026-09-28</time>
        · <a href="2504.13837.html">Does Reinforcement Learning Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?</a>
        <span class="tags">
          <a class="tag" href="?tag=RL">RL</a>
          <a class="tag" href="?tag=LLM%20reasoning">LLM reasoning</a>
          <a class="tag" href="?tag=Post-training">Post-training</a>
          <a class="tag" href="?tag=Evaluation">Evaluation</a>
          <a class="tag" href="?tag=Empirical%20study">Empirical study</a>
        </span>
      </li>
    </ul>
  </main>

  <script>
    (function () {
      var items = document.querySelectorAll("#paper-list > li");
      var bar = document.getElementById("tag-filter");
      var name = document.getElementById("tag-filter-name");

      function apply(tag) {
        items.forEach(function (li) {
          var tags = (li.getAttribute("data-tags") || "").split("|");
          li.hidden = tag ? tags.indexOf(tag) === -1 : false;
        });
        document.querySelectorAll("#paper-list .tag").forEach(function (a) {
          a.classList.toggle("is-active", a.textContent === tag);
        });
        bar.hidden = !tag;
        name.textContent = tag || "";
      }

      document.addEventListener("click", function (e) {
        var a = e.target.closest("#paper-list .tag, #tag-filter-clear");
        if (!a) return;
        e.preventDefault();
        var tag = a.classList.contains("tag") ? a.textContent : "";
        history.replaceState(null, "", tag ? "?tag=" + encodeURIComponent(tag) : "./");
        apply(tag);
      });

      apply(new URLSearchParams(location.search).get("tag") || "");
    })();
  </script>
</body>
</html>
